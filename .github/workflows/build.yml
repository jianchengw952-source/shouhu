name: Build AuraSign Pro (Dopamine & Relaxin)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debs:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Theos (with Rootless & RootHide Support)
        run: |
          brew install ldid dpkg openssl@3
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz | tar -xz -C $HOME/theos/sdks --strip-components=1

      - name: Compile Bundled zsign for iOS (Dopamine & Relaxin)
        run: |
          git clone https://github.com/zhlynn/zsign.git /tmp/zsign
          cd /tmp/zsign
          git checkout 27016df1150eeaf27e8d8c148ccb3cad10d31e73
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          mkdir -p /tmp/zsign_obj
          for src in *.cpp common/*.cpp; do
            obj="/tmp/zsign_obj/$(basename "$src" .cpp).o"
            xcrun --sdk iphoneos clang++ -arch arm64 -std=c++14 -O2 \
              -isysroot "$IOS_SDK" -miphoneos-version-min=15.0 \
              -I"$OPENSSL_PREFIX/include" -I. -I./common \
              -Wno-deprecated-declarations -c "$src" -o "$obj"
          done

          nm -gU "$OPENSSL_PREFIX/lib/libcrypto.3.dylib" | awk '{print $3}' | sed 's/^_//' | sort -u > /tmp/all_crypto_exports.txt
          nm -u /tmp/zsign_obj/*.o | sed 's/^ *_//' | sort -u > /tmp/zsign_undefs.txt
          comm -12 /tmp/all_crypto_exports.txt /tmp/zsign_undefs.txt > /tmp/openssl_syms.txt
          awk '{print "void " $1 "(void) {}"}' /tmp/openssl_syms.txt > /tmp/crypto_stub.c

          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib /tmp/crypto_stub.c \
            -isysroot "$IOS_SDK" -miphoneos-version-min=15.0 \
            -install_name "@rpath/libcrypto.3.dylib" \
            -current_version 3.0.0 -compatibility_version 3.0.0 \
            -o /tmp/libcrypto.3.dylib

          xcrun --sdk iphoneos clang++ -arch arm64 -std=c++14 -O2 \
            -isysroot "$IOS_SDK" -miphoneos-version-min=15.0 \
            /tmp/zsign_obj/*.o -L/tmp -lcrypto.3 -lz \
            -Wl,-rpath,@executable_path/../../usr/lib \
            -Wl,-rpath,@loader_path/../../usr/lib \
            -Wl,-rpath,/var/jb/usr/lib \
            -o "$GITHUB_WORKSPACE/src/App/zsign"

          ldid -S"$GITHUB_WORKSPACE/entitlements.xml" "$GITHUB_WORKSPACE/src/App/zsign"
          chmod 0755 "$GITHUB_WORKSPACE/src/App/zsign"
          ls -lh "$GITHUB_WORKSPACE/src/App/zsign"

      - name: Build Dopamine (iphoneos-arm64) & Relaxin (iphoneos-arm64e) Packages
        run: |
          export THEOS=$HOME/theos
          chmod 0755 layout/DEBIAN/postinst
          mkdir -p packages_out
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          cp packages/*.deb packages_out/ 2>/dev/null || cp ./*.deb packages_out/ 2>/dev/null || true
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1
          cp packages/*.deb packages_out/ 2>/dev/null || cp ./*.deb packages_out/ 2>/dev/null || true
          ls -lh packages_out/

      - name: Upload Dopamine (arm64) Package
        uses: actions/upload-artifact@v4
        with:
          name: AuraSignPro-Dopamine-arm64
          path: packages_out/*arm64.deb

      - name: Upload Relaxin (arm64e) Package
        uses: actions/upload-artifact@v4
        with:
          name: AuraSignPro-Relaxin-arm64e
          path: packages_out/*arm64e.deb
